---
- name: Make sure the {{ container_name }} container is created and running
  docker_container:
    name: "{{ container_name }}"
    image: "ghcr.io/kieraneglin/pinchflat:latest"
    pull: yes
    privileged: no
    labels:
      "flame.type": "application"
      "flame.name": "Pinchflat"
      "flame.url": "{{ dashboard_url }}"
      "flame.icon": "custom"
    state: "started"
    env:
      "PUID": "{{ guid }}"
      "PGID": "{{ guid }}"
      "TZ": "{{ timezone }}"
      "VERSION": "latest"
      "VIRTUAL_HOST": "pinchflat.home"
      "VIRTUAL_PORT": "8945"
    volumes:
      - "{{ docker_dir }}/{{ container_name }}:/config"
      - "/etc/localtime:/etc/localtime:ro"
      - "/tank/youtube:/downloads"
    restart_policy: always
    ports:
      - 8945:8945
    exposed_ports:
      - 8945
