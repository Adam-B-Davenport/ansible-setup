---
- name: Ensure Immich Docker network exists
  community.docker.docker_network:
    name: immich_network
    state: present

- name: Create named Docker volume for machine learning model cache
  community.docker.docker_volume:
    name: immich_model_cache
    state: present

- name: Make sure the immich_postgres container is created and running
  community.docker.docker_container:
    name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    pull: yes
    state: started
    restart_policy: always
    shm_size: 128m
    networks:
      - name: immich_network
    env:
      "PUID": "{{ guid }}"
      "PGID": "{{ guid }}"
      "TZ": "{{ timezone }}"
      "POSTGRES_PASSWORD": "postgres"
      "POSTGRES_USER": "postgres"
      "POSTGRES_DB": "immich"
      "POSTGRES_INITDB_ARGS": "--data-checksums"
      "DB_STORAGE_TYPE": "SSD"
    volumes:
      - "{{ docker_dir }}/immich/postgres:/var/lib/postgresql/data"

- name: Make sure the immich_redis container is created and running
  community.docker.docker_container:
    name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    pull: yes
    state: started
    restart_policy: always
    networks:
      - name: immich_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]

- name: Make sure the immich_machine_learning container is created and running
  community.docker.docker_container:
    name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3
    pull: yes
    state: started
    restart_policy: always
    networks:
      - name: immich_network
    volumes:
      - immich_model_cache:/cache

- name: Make sure the immich_server container is created and running
  community.docker.docker_container:
    name: immich_server
    image: ghcr.io/immich-app/immich-server:v3
    pull: yes
    state: started
    restart_policy: always
    networks:
      - name: immich_network
    labels:
      "flame.type": "application"
      "flame.name": "Immich"
      "flame.url": "{{ dashboard_url }}"
      "flame.icon": "custom"
    env:
      "PUID": "{{ guid }}"
      "PGID": "{{ guid }}"
      "TZ": "{{ timezone }}"
      "VIRTUAL_HOST": "immich.home"
      "DB_HOSTNAME": "immich_postgres"
      "DB_USERNAME": "postgres"
      "DB_PASSWORD": "postgres"
      "DB_DATABASE_NAME": "immich"
      "REDIS_HOSTNAME": "immich_redis"
    volumes:
      - "{{ docker_dir }}/immich/library:/data"
      - "/tank:/tank"
      - "/media:/media"
      - "/etc/localtime:/etc/localtime:ro"
    ports:
      - 2283:2283
