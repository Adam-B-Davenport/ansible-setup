---
- name: Make sure the {{ container_name }} container is created and running
  docker_container:
    name: "{{ container_name }}"
    image: docker.io/searxng/searxng:2026.2.11-970f2b843
    pull: yes
    privileged: no
    dns_servers:
      - 1.1.1.1
    labels:
      "flame.type": "application"
      "flame.name": "gitea"
      "flame.url": "{{ dashboard_url }}"
      "flame.icon": "custom"
    state: "started"
    env:
      "PUID": "{{ guid }}"
      "PGID": "{{ guid }}"
      "TZ": "{{ timezone }}"
    volumes:
      - "{{ docker_dir }}/{{ container_name }}/data:/var/cache/searxng/"
      - "{{ docker_dir }}/{{ container_name }}/config:/etc/searxng"
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    restart_policy: always
    ports:
      - "8080:8080"

