---
- name: Create gitea_network
  docker_network:
    name: gitea_network

- name: Make sure the "{{ container_name }}_db" container is created and running
  docker_container:
    name: "{{ container_name }}_db"
    image: docker.io/library/postgres:14
    pull: yes
    privileged: yes
    labels:
      "flame.type": "application"
      "flame.name": "gitea"
      "flame.url": "{{ dashboard_url }}"
      "flame.icon": "custom"
    state: "started"
    env:
      "PUID": "{{ guid }}"
      "PGID": "{{ guid }}"
      "TZ": "{{ timezone }}"
      "VERSION": "latest"
      "VIRTUAL_HOST": "gitea.home"
      "VIRTUAL_PORT": "3000"
      "POSTGRES_USER": "gitea"
      "POSTGRES_PASSWORD": "{{ gitea_db_password }}"
      "POSTGRES_DB": "gitea"
    networks:
      - name: gitea_network
    volumes:
      - "{{ docker_dir }}/{{ container_name }}/database:/var/lib/postgresql/data"
      - "/etc/localtime:/etc/localtime:ro"
    restart_policy: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 10s
      timeout: 5s
      retries: 5

- name: Make sure the {{ container_name }} container is created and running
  docker_container:
    name: "{{ container_name }}"
    image: docker.gitea.com/gitea:1.25.1
    pull: yes
    privileged: yes
    # This command makes Gitea wait for the DB port before launching the web server.
    # It prevents the 100% CPU loop after a host reboot.
    command: ["/bin/sh", "-c", "until nc -z {{ container_name }}_db 5432; do sleep 3; done; su-exec git /usr/bin/entrypoint /usr/local/bin/gitea web"]
    labels:
      "flame.type": "application"
      "flame.name": "gitea"
      "flame.url": "{{ dashboard_url }}"
      "flame.icon": "custom"
    state: "started"
    env:
      "PUID": "{{ guid }}"
      "PGID": "{{ guid }}"
      "TZ": "{{ timezone }}"
      "VERSION": "latest"
      "VIRTUAL_HOST": "gitea.home"
      "VIRTUAL_PORT": "3000"
      "GITEA__database__DB_TYPE": "postgres"
      # Fixed this to point to your specific DB container name
      "GITEA__database__HOST": "{{ container_name }}_db:5432"
      "GITEA__database__NAME": "gitea"
      "GITEA__database__USER": "gitea"
      "GITEA__database__PASSWD": "{{ gitea_db_password }}"
      "GITEA__server__SSH_LISTEN_PORT": "222"
      "GITEA__server__SSH_PORT": "222"
      "SSH_PORT": "222"
      "SSH_LISTEN_PORT": "222"
    networks:
      - name: gitea_network
    volumes:
      - "{{ docker_dir }}/{{ container_name }}/data:/data"
      - "{{ docker_dir }}/{{ container_name }}/ssh:/etc/ssh"
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    restart_policy: always
    ports:
      - "3000:3000"
      - "222:222"
